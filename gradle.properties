pluginGroup = io.github.veyronsakai.githubmcptools
pluginName = GitHub MCP Toolset
pluginVersion = 0.0.1

pluginRepositoryUrl = https://github.com/VeyronSakai/intellij-github-mcp-tools

# Supported build range -> https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
# 253 = 2025.3. No upper bound; internal GitHub plugin APIs must be checked on every new branch.
pluginSinceBuild = 253

# IDE to compile against. Use the oldest supported version so newer-only APIs fail at compile time.
platformVersion = 2025.3.6

# IDEs checked by `./gradlew verifyPlugin`: the latest of each supported line (253, 261, 262, 263).
# Add the next line here when it is released.
pluginVerifierIdeVersions = 2025.3.6, 2026.1.5.1, 2026.2.4, 263.7307.112

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true
