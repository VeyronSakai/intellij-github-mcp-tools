# Release flow:
# - Pull requests are labeled from their branch names. On every push to main, release-drafter updates the release draft
#   (release notes and the next version, from the labels of merged pull requests; see .github/release-drafter.yml).
# - Run this workflow manually on main (Actions > Release > Run workflow, or `gh workflow run release.yml`) to release:
#   the signed plugin is built with the draft's version, attached to the draft, and then the draft is published.
#   The repository uses immutable releases, so assets must be attached before publishing.
#
# Signing requires the secrets PRIVATE_KEY, PRIVATE_KEY_PASSWORD and CERTIFICATE_CHAIN.
# Publishing to JetBrains Marketplace also requires PUBLISH_TOKEN and the repository variable PUBLISH_TO_MARKETPLACE=true.
# See https://plugins.jetbrains.com/docs/intellij/plugin-signing.html for more information.

name: Release
on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, reopened, synchronize, edited ]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # Label pull requests from their branch names (the labels decide the release notes section and the next version).
  # Skipped for Dependabot and forks, whose token cannot write; Dependabot adds the "dependencies" label itself.
  autolabel:
    name: Label pull request
    if: ${{ github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter/autolabeler@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0

  # Update the release draft from the pull requests merged into main
  updateReleaseDraft:
    name: Update release draft
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: ${{ github.workflow }}-draft
      cancel-in-progress: false
    outputs:
      tag_name: ${{ steps.release-drafter.outputs.tag_name }}
    steps:
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        id: release-drafter
        with:
          commitish: main

  # Build and sign the plugin, attach it to the draft, publish to Marketplace if enabled, and publish the draft
  release:
    name: Publish Plugin
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs: updateReleaseDraft
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-release
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.updateReleaseDraft.outputs.tag_name }}
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          preinstalled-runtimes: false
          large-packages: false

      # Check out the commit this workflow runs on (it is also the commit the release tag is created on)
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      # Build and sign the plugin with the version of the release draft
      - name: Sign Plugin
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "::error::release-drafter did not resolve a version."
            exit 1
          fi
          ./gradlew signPlugin -PpluginVersion="$VERSION"

      # Attach the signed plugin to the draft (assets cannot be added after publishing)
      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$VERSION" ./build/distributions/*-signed.zip --clobber

      # Publish the plugin to JetBrains Marketplace, only when the repository variable PUBLISH_TO_MARKETPLACE is "true"
      - name: Publish to Marketplace
        if: ${{ vars.PUBLISH_TO_MARKETPLACE == 'true' }}
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin -PpluginVersion="$VERSION"

      # Publish the draft; the tag is created on the commit that was built
      - name: Publish Release
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          publish: true
          commitish: ${{ github.sha }}
